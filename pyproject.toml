[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-dependency-grapher"
version = "0.1.0"
description = "Fast static analysis dependency graph generator extracting import topology and call graphs for repo-level AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
code-dependency-grapher = "code_dependency_grapher.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["code_dependency_grapher*"]
